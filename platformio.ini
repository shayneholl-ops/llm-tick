; llm-tick — Waveshare ESP32-S3-LCD-1.47B (ST7789 172x320, 8MB PSRAM, 16MB flash)
; Native USB-Serial/JTAG, LittleFS unused (no filesystem needed).
;
; 2026-10-02: the BLE→USB keyboard bridge (F1) was REMOVED — the Keychron K8 is a
; Bluetooth *Classic* (BR/EDR) device and the ESP32-S3 is BLE-only, so the two can
; never interoperate (see HANDOFF.md item 24 for the proof). This restores the
; pre-F1 USB config: ARDUINO_USB_MODE=1 = USB-Serial/JTAG console, no TinyUSB
; composite, no HID keyboard, familiar flashing. NimBLE-Arduino dropped.
[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = colorize
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    ; The Arduino loopTask stack. The default is 8192 bytes, and WebServer's
    ; handleClient() (HTTP header parsing + String allocation + the handlers) runs on
    ; that task. With a client connected it overflowed, corrupting memory and panicking
    ; with StoreProhibited (EXCVADDR 0x0b) the instant a phone associated with the
    ; Setup AP. 16 KB gives HTTP work real headroom; the firmware's RAM headroom is
    ; ample (16.9% of 320 KB before this).
    -DARDUINO_LOOP_STACK_SIZE=16384
upload_protocol = esptool
upload_speed = 921600
lib_deps =
    https://github.com/lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; QR encoder for the Provisioning screen. Small C library (BSD), versions 1-40,
    ; ECC L/M/Q/H — everything needed for a "WIFI:" join URI on the Panel.
    ; NOTE: the original F2 research recommended "tqbrecht/uQRCode", which does NOT
    ; exist (GitHub 404, absent from the PlatformIO registry). This replaces it.
    ricmoo/QRCode@^0.0.1

; DIAGNOSTIC env (2026-10-02): same firmware but with the web server compiled out, to
; separate "the WebServer crashes on association" from "the WiFi driver's RX path
; crashes on association". Build with:
;   pio run -e esp32s3-nohttp
[env:esp32s3-nohttp]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DPROV_NO_HTTP=1
