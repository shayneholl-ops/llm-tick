; llm-tick — Waveshare ESP32-S3-LCD-1.47B (ST7789 172x320, 8MB PSRAM, 16MB flash)
; Native USB-Serial/JTAG, LittleFS unused (no filesystem needed).
;
; 2026-10-02: the BLE→USB keyboard bridge (F1) was REMOVED — the Keychron K8 is a
; Bluetooth *Classic* (BR/EDR) device and the ESP32-S3 is BLE-only, so the two can
; never interoperate (see HANDOFF.md item 24 for the proof). This restores the
; pre-F1 USB config: ARDUINO_USB_MODE=1 = USB-Serial/JTAG console, no TinyUSB
; composite, no HID keyboard, familiar flashing. NimBLE-Arduino dropped.
;
; The DEFAULT environment is esp32s3-idf, NOT esp32s3. See the long note there: the
; Arduino env links a prebuilt WiFi driver whose dynamic RX buffer pool corrupts TLSF
; heap, and it panics as soon as a client associates with the Setup AP. That is the
; defect issue #6 exists to eliminate, so a bare `pio run` must not build it.
[env:esp32s3-idf]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = colorize
board_build.arduino.memory_type = qio_opi
; One partition table for both environments. The IDF builder resolves
; board.build.partitions the same way and falls back to a project-relative path
; (espidf.py: generate_partition_table), so this single file serves both — instead of
; the build demanding the framework's own huge_app.csv by name.
board_build.partitions = partitions.csv
; Turn PlatformIO's Library Dependency Finder OFF.
;
; WHY: with the LDF on, PlatformIO resolves the Arduino BUILT-IN libraries (WiFi,
; HTTPClient, WebServer, WiFiClientSecure, ...) and compiles them itself, into
; libdeps/build as if they were third-party libraries. The IDF arduino component lists
; the same sources explicitly in its own LIBRARY_SRCS, so the two race: the result was
; that WiFiClientSecure.cpp landed in libframework-arduinoespressif32.a while
; ssl_client.cpp did not, and the link died with
;   undefined reference to `start_ssl_client(sslclient_context*, IPAddress const&, ...)'
; (plus send_ssl_data, get_ssl_receive, data_to_read, ssl_init, stop_ssl_socket).
; The archive confirmed it: nm showed those symbols as U (undefined) inside it.
;
; With the LDF off, the IDF component compiles every Arduino library from its own
; source list, and PlatformIO compiles only the lib_deps we actually declared
; (LovyanGFX, ArduinoJson, NeoPixel, QRCode) — no overlap.
lib_ldf_mode = off
build_unflags =
    -Werror
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Suppress diagnostics that are noisy in THIRD-PARTY code. Note the last two are
    ; NOT third-party-only: -Wno-unused-variable / -Wno-unused-but-set-variable apply
    ; to src/ as well, and src/main.cpp does still trip them (blTask is defined but
    ; unused). They stay because the IDF build is the default and must build clean
    ; with warnings on; the diagnostic value of those two in our own code is low
    ; because the compiler still reports every USE of a genuinely unused thing.
    -Wno-error
    -Wno-unknown-pragmas
    -Wno-unused-variable
    -Wno-unused-but-set-variable
upload_protocol = esptool
upload_speed = 921600
lib_deps =
    https://github.com/lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; QR encoder for the Provisioning Panel screen. Small C library (BSD), versions
    ; 1-40, ECC L/M/Q/H — everything needed for a "WIFI:" join URI on the Panel.
    ; NOTE: the original F2 research recommended "tqbrecht/uQRCode", which does NOT
    ; exist (GitHub 404, absent from the PlatformIO registry). This replaces it.
    ricmoo/QRCode@^0.0.1

; The MIXED-FRAMEWORK env IS the shipping env (issue #6) — the section above. Its
; history, and why the driver is compiled from IDF source rather than linked
; prebuilt, is recorded in the note further down.
;
; [env:esp32s3] below is the LEGACY plain-Arduino build, kept ONLY as a differential
; diagnostic: it is the pre-fix configuration, so building and running it is how you
; reproduce the original Setup AP panic. It is deliberately NOT the default.

; LEGACY plain-Arduino env. Reproduces the Setup AP crash (issue #6) — the WiFi
; driver's dynamic RX buffer pool corrupting TLSF heap, panicking ~1 s after a client
; associates. Do NOT ship this; build esp32s3-idf. Kept so the diagnosis stays
; reproducible rather than becoming folklore.
[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = colorize
board_build.arduino.memory_type = qio_opi
; One partition table for both environments. The IDF builder resolves
; board.build.partitions the same way and falls back to a project-relative path
; (espidf.py: generate_partition_table), so this single file serves both — instead of
; the build demanding the framework's own huge_app.csv by name.
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    ; The Arduino loopTask stack. The default is 8192 bytes, and WebServer's
    ; handleClient() (HTTP header parsing + String allocation + the handlers) runs on
    ; that task. With a client connected it overflowed, corrupting memory and panicking
    ; with StoreProhibited (EXCVADDR 0x0b) the instant a phone associated with the
    ; Setup AP. 16 KB gives HTTP work real headroom; the firmware's RAM headroom is
    ; ample (16.9% of 320 KB before this).
    -DARDUINO_LOOP_STACK_SIZE=16384
upload_protocol = esptool
upload_speed = 921600
lib_deps =
    https://github.com/lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; QR encoder for the Provisioning screen. Small C library (BSD), versions 1-40,
    ; ECC L/M/Q/H — everything needed for a "WIFI:" join URI on the Panel.
    ; NOTE: the original F2 research recommended "tqbrecht/uQRCode", which does NOT
    ; exist (GitHub 404, absent from the PlatformIO registry). This replaces it.
    ricmoo/QRCode@^0.0.1

; DIAGNOSTIC env (2026-10-02): the LEGACY Arduino build with the web server compiled
; out. Issue #6 named this as the way to separate "the WebServer crashes on
; association" from "the WiFi driver's RX path crashes on association" — and it did
; exactly that (the crash reproduced with no HTTP code in the image). The question is
; now answered and recorded in HANDOFF.md item 5, but the env is kept: it is the only
; way to re-confirm that conclusion against a future driver change.
;   pio run -e esp32s3-nohttp
[env:esp32s3-nohttp]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DPROV_NO_HTTP=1

; kconfig = -kconfig   ; uncomment to force a re-read of sdkconfig.defaults if a stale
                       ; sdkconfig.<env> is cached; it is generated at the build root.
;                       ; Alternatively delete sdkconfig.<env> and rebuild.
