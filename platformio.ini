; llm-tick — Waveshare ESP32-S3-LCD-1.47B (ST7789 172x320, 8MB PSRAM, 16MB flash)
; Native USB-Serial/JTAG, LittleFS unused (no filesystem needed).
;
; 2026-10-02: the BLE→USB keyboard bridge (F1) was REMOVED — the Keychron K8 is a
; Bluetooth *Classic* (BR/EDR) device and the ESP32-S3 is BLE-only, so the two can
; never interoperate (see HANDOFF.md item 24 for the proof). This restores the
; pre-F1 USB config: ARDUINO_USB_MODE=1 = USB-Serial/JTAG console, no TinyUSB
; composite, no HID keyboard, familiar flashing. NimBLE-Arduino dropped.
[env:esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = colorize
board_build.arduino.memory_type = qio_opi
; One partition table for both environments. The IDF builder resolves
; board.build.partitions the same way and falls back to a project-relative path
; (espidf.py: generate_partition_table), so this single file serves both — instead of
; the build demanding the framework's own huge_app.csv by name.
board_build.partitions = partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    ; The Arduino loopTask stack. The default is 8192 bytes, and WebServer's
    ; handleClient() (HTTP header parsing + String allocation + the handlers) runs on
    ; that task. With a client connected it overflowed, corrupting memory and panicking
    ; with StoreProhibited (EXCVADDR 0x0b) the instant a phone associated with the
    ; Setup AP. 16 KB gives HTTP work real headroom; the firmware's RAM headroom is
    ; ample (16.9% of 320 KB before this).
    -DARDUINO_LOOP_STACK_SIZE=16384
upload_protocol = esptool
upload_speed = 921600
lib_deps =
    https://github.com/lovyan03/LovyanGFX
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
    ; QR encoder for the Provisioning screen. Small C library (BSD), versions 1-40,
    ; ECC L/M/Q/H — everything needed for a "WIFI:" join URI on the Panel.
    ; NOTE: the original F2 research recommended "tqbrecht/uQRCode", which does NOT
    ; exist (GitHub 404, absent from the PlatformIO registry). This replaces it.
    ricmoo/QRCode@^0.0.1

; DIAGNOSTIC env (2026-10-02): same firmware but with the web server compiled out, to
; separate "the WebServer crashes on association" from "the WiFi driver's RX path
; crashes on association". Build with:
;   pio run -e esp32s3-nohttp
[env:esp32s3-nohttp]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DPROV_NO_HTTP=1

; MIXED-FRAMEWORK env (2026-10-02, issue #6): the SAME application source, but built
; with the espidf framework present as well as arduino.
;
; WHY: the Board panics when a client associates with the Setup AP — the WiFi driver's
; dynamic RX buffer pool corrupting TLSF heap metadata (HANDOFF.md item 5). The Arduino
; framework on its own links a PREBUILT driver (DYNAMIC_RX_BUFFER_NUM=32) and never
; reads sdkconfig.defaults, so the bug is unfixable there.
;
; PlatformIO's espressif32 platform supports BOTH frameworks at once (platform.py
; branches on `"espidf" in frameworks` AND `"arduino" in frameworks`, and explicitly
; handles "mixed Arduino+IDF projects"). With espidf present the platform builds the
; driver from IDF source, so sdkconfig.defaults applies and
; CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=0 actually lands — the pool stops existing
; instead of merely being provoked less often.
;
; The app code is UNCHANGED: still Arduino APIs, still the same src/.
; Build with:  pio run -e esp32s3-idf
[env:esp32s3-idf]
extends = env:esp32s3
framework = arduino, espidf
; Turn PlatformIO's Library Dependency Finder OFF for this env.
;
; WHY: with the LDF on, PlatformIO resolves the Arduino BUILT-IN libraries (WiFi,
; HTTPClient, WebServer, WiFiClientSecure, ...) and compiles them itself, into
; libdeps/build as if they were third-party libraries. The IDF arduino component lists
; the same sources explicitly in its own LIBRARY_SRCS, so the two race: the result was
; that WiFiClientSecure.cpp landed in libframework-arduinoespressif32.a while
; ssl_client.cpp did not, and the link died with
;   undefined reference to `start_ssl_client(sslclient_context*, IPAddress const&, ...)'
; (plus send_ssl_data, get_ssl_receive, data_to_read, ssl_init, stop_ssl_socket).
; The archive confirmed it: nm showed those symbols as U (undefined) inside it.
;
; With the LDF off, the IDF component compiles every Arduino library from its own
; source list, and PlatformIO compiles only the lib_deps we actually declared
; (LovyanGFX, ArduinoJson, NeoPixel, QRCode) — no overlap.
lib_ldf_mode = off
; The IDF build compiles with -Werror and is stricter than the Arduino one.
build_unflags =
    -Werror
build_flags =
    ${env:esp32s3.build_flags}
    ; Suppress diagnostics from THIRD-PARTY code only; our sources are clean under IDF.
    ; ricmoo/QRCode uses `#pragma mark`, an Apple idiom GCC does not know.
    -Wno-error
    -Wno-unknown-pragmas
    -Wno-unused-variable
    -Wno-unused-but-set-variable
; kconfig = -kconfig   ; uncomment to force a re-read of sdkconfig.defaults if a stale
                       ; sdkconfig.<env> is cached; it is generated at the build root.
